name: Keep API warm

on:
  schedule:
    # Render free tier sleeps after ~15 min idle — ping every 10 min.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Tearz API health
        run: |
          curl -sf --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            https://tearz-chat-api.onrender.com/health
