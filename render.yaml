# Render Blueprint — backend + web-демо на одном URL
services:
  - type: web
    name: tearz-chat-api
    runtime: node
    rootDir: server
    # Web кладётся в public/app локально (`npm run build:web`) и едет с репо.
    # APK опционален: протухший артефакт Expo не должен валить деплой API.
    buildCommand: npm install && mkdir -p public/android && (curl -fL --retry 2 --max-time 120 -o public/android/tearz.apk "https://expo.dev/artifacts/eas/q7YHD9aAcsYx7t2GgJRdJXJ1AJc-Un5Q7FEm8xvvQ1E.apk" || rm -f public/android/tearz.apk) && ls -lh public/android || true
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_FROM_EMAIL
        sync: false
      - key: TEACHER_MODEL
        value: gpt-4.1
      - key: TEACHER_FAST_MODEL
        value: gpt-4.1-mini
      - key: COMPANION_MODEL
        value: gpt-4.1
