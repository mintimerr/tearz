# Render Blueprint — backend + web-демо на одном URL
services:
  - type: web
    name: tearz-chat-api
    runtime: node
    rootDir: server
    # Web кладётся в public/app локально (`npm run build:web`) и едет с репо.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_FROM_EMAIL
        sync: false
      - key: TEACHER_MODEL
        value: gpt-4.1
      - key: TEACHER_FAST_MODEL
        value: gpt-4.1-mini
      - key: COMPANION_MODEL
        value: gpt-4.1
