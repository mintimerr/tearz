# Render Blueprint — backend + web-демо на одном URL
services:
  - type: web
    name: tearz-chat-api
    runtime: node
    rootDir: server
    # Web кладётся в public/app локально (`npm run build:web`) и едет с репо.
    # APK качаем на билде — в git не храним (*.apk), иначе Android не скачивает с Expo-редиректов.
    buildCommand: npm install && mkdir -p public/android && curl -fsSL -o public/android/tearz.apk "https://expo.dev/artifacts/eas/_ORtBvaItA-uLf0XpAvUallvmSuv5m_24g5ICgEs5s8.apk" && ls -lh public/android/tearz.apk
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_FROM_EMAIL
        sync: false
      - key: TEACHER_MODEL
        value: gpt-4.1
      - key: TEACHER_FAST_MODEL
        value: gpt-4.1-mini
      - key: COMPANION_MODEL
        value: gpt-4.1
